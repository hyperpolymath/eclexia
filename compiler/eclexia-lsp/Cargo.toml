[package]
name = "eclexia-lsp"
version = "0.1.0"
edition = "2021"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
license = "MPL-2.0"

[[bin]]
name = "eclexia-lsp"
path = "src/main.rs"

[dependencies]
# tower-lsp-server 0.21 (the maintained rename of tower-lsp) pulls dashmap 6,
# whose hashbrown requirement is >= 0.15 — this removes the last hashbrown
# 0.14.x from the graph (RUSTSEC-2024-0402, Borsh non-canonical HashMap
# serialisation). lsp-types moved from url::Url to lsp_types::Uri in 0.97.
tower-lsp-server = "0.21"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "6"

# Eclexia internal crates
eclexia-parser = { path = "../eclexia-parser" }
eclexia-typeck = { path = "../eclexia-typeck" }
eclexia-ast = { path = "../eclexia-ast" }
eclexia-fmt = { path = "../eclexia-fmt" }
eclexia-lint = { path = "../eclexia-lint" }

[dev-dependencies]
smol_str = "0.2"

[features]
default = []
