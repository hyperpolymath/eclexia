# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Criterion benchmarks on CI hardware. Closes the "no measured benchmarks"
# Known-Gap: performance claims in the docs must cite numbers produced here
# (or locally via `just bench`), never projections.
#
# Weekly + on demand; not per-push (a full criterion sweep costs several
# minutes of noisy-neighbour runner time).

name: Benchmarks

on:
  schedule:
    - cron: '0 5 * * 1'  # Weekly, Monday 05:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: cargo bench (parser corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain (stable, floor-aware)
        env:
          MIN_RUST: '1.96.0'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version && cargo --version
          have="$(rustc --version | awk '{print $2}')"
          if [ "$(printf '%s\n%s\n' "$MIN_RUST" "$have" | sort -V | head -1)" != "$MIN_RUST" ]; then
            echo "::error::rustc $have is below the required floor $MIN_RUST"; exit 1
          fi

      - name: Run benchmarks
        run: cargo bench -p eclexia-parser

      - name: Summarise results
        if: always()
        run: |
          echo "## Benchmark results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -d target/criterion ]; then
            grep -rh "time:" target/criterion 2>/dev/null | head -50 >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "no criterion output found" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload criterion reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: criterion-reports
          path: target/criterion
          retention-days: 30
          if-no-files-found: ignore
