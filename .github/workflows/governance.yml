# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# governance.yml — single wrapper calling the shared estate governance bundle
# in hyperpolymath/standards instead of carrying per-repo copies.
#
# Replaces the per-repo governance scaffolding removed in the same commit:
#   quality.yml, guix-guix-policy.yml, npm-bun-blocker.yml, ts-blocker.yml,
#   security-policy.yml, rsr-antipattern.yml, wellknown-enforcement.yml,
#   workflow-linter.yml
#
# Load-bearing build/security workflows stay standalone in the repo
# (build, codeql, cargo-audit, dependabot, release, scan/mirror/pages plumbing).
#
# Pin policy: all estate reusable wrappers are pinned to the same standards
# revision the rsr-template-repo ships (da2c748aad55c1a1dcba00b60fe4a35017bc6540).
# The governance-reusable at that revision fixed several defects that made this
# repo's Governance gate red on an empty tree:
#   - "Check live Actions policy" ran unconditionally and failed when the
#     credential was absent; it is now a credentialed advisory job that skips
#     honestly when HYPATIA_SCAN_PAT is not supplied (standards #684..#700).
#   - The inline "Check SHA-pinned actions" step demanded inline SHA pins even
#     for actions.lock-managed refs; lock verification now lives in its own
#     actions-lock-verify job that honours a valid actions.lock.

name: Governance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Estate guardrail: cancel superseded runs so re-pushes / rebased PR
# updates do not pile up queued runs against the shared account-wide
# Actions concurrency pool. Applied only to read-only check workflows
# (no publish/mutation), so cancelling a superseded run is always safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read      # required by the reusable workflow (staleness check reads workflow runs)
  contents: read

jobs:
  governance:
    uses: hyperpolymath/standards/.github/workflows/governance-reusable.yml@da2c748aad55c1a1dcba00b60fe4a35017bc6540
