name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
# Single secret scanner. The standards reusable runs gitleaks (+ a Rust-secrets
# check). An inline TruffleHog job previously lived here, but the reusable
# DELIBERATELY retired TruffleHog as redundant (gitleaks gives sufficient
# coverage at lower cost). Re-adding it would be duplicated work, not extra
# coverage.
jobs:
  scan:
    # The reusable installs and executes a pinned gitleaks binary directly.
    # Since standards#500 it neither comments on PRs nor reads workflow-run
    # metadata, so `contents: read` is the complete permission contract. Keep
    # this job-level block explicit: it replaces the workflow-level grant and
    # is therefore the cap GitHub applies to the called workflow. (The wider
    # job-level grant here previously surfaced as a Hypatia over-privilege
    # finding; the reusable needs nothing beyond contents: read.)
    permissions:
      contents: read
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@da2c748aad55c1a1dcba00b60fe4a35017bc6540
